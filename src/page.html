<!doctype html>
<html lang="en" data-scheme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pele-preview</title>
<style>
  /* The page styles only its own chrome (ids prefixed pp-) and the backdrop
     behind the diagram. Its colors follow the diagram's scheme. */
  :root { --pp-paper: #ffffff; --pp-ink: #1f1f1f; color-scheme: light; }
  :root[data-scheme="dark"] { --pp-paper: #161616; --pp-ink: #e6e6e6; color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root[data-scheme="auto"] { --pp-paper: #161616; --pp-ink: #e6e6e6; color-scheme: dark; }
  }

  body { margin: 0; font: 13px system-ui, sans-serif; background: var(--pp-paper); color: var(--pp-ink); }


  #pp-error { display: none; margin: 0; padding: 12px 16px; white-space: pre-wrap;
              font: 12px ui-monospace, monospace; background: #fde8e8; color: #8a1c1c; }
  #pp-error.shown { display: block; }
  #pp-stage { padding: 24px; }
  /* The diagram sits on its own --pele-bg (white unless the CSS sets it). */
  #pp-stage > svg { background: var(--_bg); }
  #pp-stage.stale { opacity: .35; filter: grayscale(1); }
</style>
</head>
<body>
<pre id="pp-error"></pre>
<div id="pp-stage"></div>
<script type="module">
  // The diagram's styling arrives inside the SVG, exactly as `-o` with the
  // same --scheme would write it.
  const stage = document.getElementById("pp-stage");
  const error = document.getElementById("pp-error");
  let shown = null;   // revision currently on screen
  let seq = 0;        // only the latest update() may touch the DOM

  async function update() {
    const mine = ++seq;
    const state = await (await fetch("/state.json", { cache: "no-store" })).json();
    if (mine !== seq) return;
    // The page's own colors follow the scheme the diagram was written for.
    document.documentElement.dataset.scheme = state.scheme;
    if (state.revision === shown) return;
    const svg = await (await fetch(`/diagram.svg?rev=${state.revision}`)).text();
    if (mine !== seq) return;
    stage.innerHTML = svg;
    error.textContent = state.error ?? "";
    error.classList.toggle("shown", Boolean(state.error));
    stage.classList.toggle("stale", Boolean(state.error));
    shown = state.revision;
  }

  new EventSource("/events").onmessage = update;
</script>
</body>
</html>
