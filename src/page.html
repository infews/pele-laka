<!doctype html>
<html lang="en" data-scheme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pele-preview</title>
<style>
  /* The page styles only its own chrome (ids prefixed pp-) and the backdrop
     behind the diagram. Its colors follow the scheme toggle. */
  :root { --pp-paper: #ffffff; --pp-ink: #1f1f1f; --pp-rule: #d4d4d4; color-scheme: light; }
  :root[data-scheme="dark"] { --pp-paper: #161616; --pp-ink: #e6e6e6; --pp-rule: #3a3a3a; color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root[data-scheme="auto"] { --pp-paper: #161616; --pp-ink: #e6e6e6; --pp-rule: #3a3a3a; color-scheme: dark; }
  }

  body { margin: 0; font: 13px system-ui, sans-serif; background: var(--pp-paper); color: var(--pp-ink); }

  #pp-bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 8px 12px; }
  #pp-palette-wrap[hidden] { display: none; }
  #pp-palette { font: inherit; padding: 3px 6px; border: 1px solid var(--pp-rule); border-radius: 6px;
                background: var(--pp-paper); color: inherit; }
  #pp-scheme { display: inline-flex; border: 1px solid var(--pp-rule); border-radius: 6px; overflow: hidden; }
  #pp-scheme button { font: inherit; padding: 4px 10px; border: 0; background: transparent; color: inherit; cursor: pointer; }
  #pp-scheme button + button { border-left: 1px solid var(--pp-rule); }
  #pp-scheme button[aria-pressed="true"] { background: var(--pp-ink); color: var(--pp-paper); }

  #pp-error { display: none; margin: 0; padding: 12px 16px; white-space: pre-wrap;
              font: 12px ui-monospace, monospace; background: #fde8e8; color: #8a1c1c; }
  #pp-error.shown { display: block; }
  #pp-stage { padding: 24px; }
  /* The diagram sits on its own --pele-bg (white unless the CSS sets it). */
  #pp-stage > svg { background: var(--_bg); }
  #pp-stage.stale { opacity: .35; filter: grayscale(1); }
</style>
</head>
<body>
<div id="pp-bar">
  <label id="pp-palette-wrap" hidden>Palette <select id="pp-palette"></select></label>
  <div id="pp-scheme" role="group" aria-label="Color scheme">
    <button type="button" data-scheme="auto" aria-pressed="true">Auto</button>
    <button type="button" data-scheme="light" aria-pressed="false">Light</button>
    <button type="button" data-scheme="dark" aria-pressed="false">Dark</button>
  </div>
</div>
<pre id="pp-error"></pre>
<div id="pp-stage"></div>
<script type="module">
  // The diagram's styling arrives inside the SVG, exactly as `-o` with the
  // same --scheme and --palette would write it.
  const stage = document.getElementById("pp-stage");
  const error = document.getElementById("pp-error");
  const buttons = document.querySelectorAll("#pp-scheme button");
  const paletteWrap = document.getElementById("pp-palette-wrap");
  const paletteSelect = document.getElementById("pp-palette");
  let scheme = null;  // set from the server's starting scheme on first update
  let palette = null; // "" means the stylesheet's default; null until first update
  let shown = null;   // "revision:scheme:palette" currently on screen
  let seq = 0;        // only the latest update() may touch the DOM

  function setScheme(next) {
    scheme = next;
    document.documentElement.dataset.scheme = next;
    for (const b of buttons) b.setAttribute("aria-pressed", String(b.dataset.scheme === next));
  }

  // Rebuilt on every update, since editing the stylesheet can add or remove
  // palettes. A chosen palette the sheet no longer defines stays listed.
  function showPalettes(names) {
    const all = palette && !names.includes(palette) ? [...names, palette] : names;
    paletteSelect.replaceChildren(
      new Option("default", ""),
      ...all.map((name) => new Option(name, name)),
    );
    paletteSelect.value = palette;
    paletteWrap.hidden = all.length === 0;
  }

  async function update() {
    const mine = ++seq;
    const state = await (await fetch("/state.json", { cache: "no-store" })).json();
    if (mine !== seq) return;
    if (scheme === null) setScheme(state.scheme);
    if (palette === null) palette = state.palette ?? "";
    showPalettes(state.palettes);
    const key = `${state.revision}:${scheme}:${palette}`;
    if (key === shown) return;
    const query = new URLSearchParams({ scheme, palette, rev: state.revision });
    const svg = await (await fetch(`/diagram.svg?${query}`)).text();
    if (mine !== seq) return;
    stage.innerHTML = svg;
    error.textContent = state.error ?? "";
    error.classList.toggle("shown", Boolean(state.error));
    stage.classList.toggle("stale", Boolean(state.error));
    shown = key;
  }

  for (const b of buttons) b.addEventListener("click", () => { setScheme(b.dataset.scheme); update(); });
  paletteSelect.addEventListener("change", () => { palette = paletteSelect.value; update(); });
  new EventSource("/events").onmessage = update;
</script>
</body>
</html>
